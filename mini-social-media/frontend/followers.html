<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniSocial - My Followers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <span>📱</span> MiniSocial
      </a>
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle menu">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="explore.html">🔍 Explore</a></li>
        <li><a href="create-post.html">✍️ Create Post</a></li>
        <li><a href="profile.html">👤 Profile</a></li>
        <li><a href="followers.html" class="active">👥 Followers</a></li>
        <li><a href="following.html">➡️ Following</a></li>
        <li id="auth-links" style="display: none;">
          <a href="login.html">🔑 Login</a>
        </li>
        <li id="user-links" style="display: none;">
          <button id="logout-btn" class="btn-danger">🚪 Logout</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <h2 style="margin-bottom: 24px; font-weight: 800; letter-spacing: -0.02em;">👥 My Followers</h2>
    <div id="users-list"></div>
  </main>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/follow.js"></script>
  <script type="module">
    import { initFollowersPage, viewUserProfile } from './js/follow.js';
    document.addEventListener('DOMContentLoaded', initFollowersPage);

    window.toggleMobileMenu = function() {
      document.getElementById('nav-links').classList.toggle('open');
    };
    window.viewUserProfile = viewUserProfile;
  </script>
</body>
</html>
